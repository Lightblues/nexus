name: Build Nexus (Swift)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.0)'
        required: false
        default: ''
  push:
    tags:
      - 'nexus-v*'

jobs:
  build:
    runs-on: macos-14   # Apple Silicon runner — fastest archive + universal output
    defaults:
      run:
        working-directory: nexus-swift
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/nexus-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/nexus-v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(awk -F'"' '/CFBundleShortVersionString/ {print $2; exit}' project.yml)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building v$VERSION"

      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./scripts/build-mac.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: Nexus-dmg
          path: nexus-swift/dist/Nexus-*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Show dist contents
        run: ls -la dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/nexus-v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/nexus-v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Nexus v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: artifacts/**/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Update Homebrew tap (inline, avoids GITHUB_TOKEN event limitation) ---

      - name: Compute DMG sha256
        id: hash
        run: |
          DMG=$(find artifacts -name "Nexus-*.dmg" | head -1)
          [[ -f "$DMG" ]] || { echo "No DMG found"; exit 1; }
          echo "SHA=$(sha256sum "$DMG" | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "DMG=$DMG" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        uses: actions/checkout@v5
        with:
          repository: lightblues/homebrew-tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}
          path: tap

      - name: Update cask file
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          SHA: ${{ steps.hash.outputs.SHA }}
        run: |
          CASK=tap/Casks/nexus.rb
          python3 - <<PY
          import re, pathlib, os
          p = pathlib.Path("$CASK")
          s = p.read_text()
          s = re.sub(r'version "[^"]+"', f'version "{os.environ["VERSION"]}"', s, count=1)
          # Single sha256 (universal binary). The cask file uses
          # `sha256 "..."` after the version → match exactly that.
          s = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{os.environ["SHA"]}"', s, count=1)
          p.write_text(s)
          PY
          cat "$CASK"

      - name: Push cask update
        working-directory: tap
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/nexus.rb
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "nexus: bump to ${{ steps.version.outputs.VERSION }}"
          git push
