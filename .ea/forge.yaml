# forge repository defaults. Issue frontmatter overrides these; CLI flags override both.
prefix: nexus
sync: server     # server: issues sync through the forge server and stay out of git | git: issue files are committed
delivery: none   # applied when an issue reaches done: none | commit (current branch) | push (commit, then push)
review: false    # true: a finished issue waits in review/ until you confirm; the agent then closes it (forge-close)
# unattended: true # create the agent with Auto Accept; false leaves permission prompts for you
# provider: cursor
# mode: default
# host: local
